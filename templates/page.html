{% extends "base.html" %}

{% block content %}
<article>
    <h1 style="margin-bottom: 0.5rem;">{{ page.title }}</h1>

    <div class="prose">
        {{ page.content | safe }}
    </div>

    {% if page.taxonomies.tags %}
    <div class="taxonomies text-center mt-8">
        {% for tag in page.taxonomies.tags %}
        <a href="{{ get_taxonomy_url(kind="tags", name=tag) }}"
            class="tag">#{{ tag }}</a>
        {% endfor %}
    </div>
    {% endif %}
</article>
{% endblock content %}
