base_url = "https://joshbowen.net"
title = "Josh Bowen's Weblog"
author = "Josh Bowen"

compile_sass = false
generate_feeds = true
minify_html = true

taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true },
]

[markdown]
highlighting = { theme = "solarized-light" }
bottom_footnotes = true
insert_anchor_links = "right"

[extra]
list_pages = true
header_nav = [
    { name = "/home", url = "/" },
    { name = "/posts", url = "/posts/" },
    { name = "/about", url = "/pages/about/" },
    { name = "/tags", url = "/tags/" },
    { name = "/categories", url = "/categories/" },
    { name = "/feeds", url = "/pages/feeds/" },
]
